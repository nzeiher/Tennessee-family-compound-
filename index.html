<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tennessee Family Compound — Master Property Review Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f4f4}
#app{height:100%;display:flex;flex-direction:column}
#toolbar{background:#fff;border-bottom:1px solid #ccc;padding:8px 10px;box-shadow:0 1px 5px rgba(0,0,0,.12);z-index:1001}
.titleRow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.titleRow h2{font-size:18px;margin:0 8px 0 0}
.stats{font-size:13px;color:#333}
.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:7px}
.controls input[type=text]{min-width:260px;padding:7px 9px;border:1px solid #aaa;border-radius:5px}
.controls select,.controls button,.fileBtn{padding:7px 9px;border:1px solid #aaa;border-radius:5px;background:#fff;cursor:pointer;font-size:13px}
.controls button:hover,.fileBtn:hover{background:#f1f1f1}
.legend{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:7px;font-size:12px}
.legend label{display:flex;align-items:center;gap:4px;cursor:pointer}
.iconFilters{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:7px;padding-top:6px;border-top:1px solid #ddd;font-size:12px}
.iconFilter{padding:5px 8px;border:1px solid #aaa;border-radius:5px;background:#fff;cursor:pointer;font-size:12px}.iconFilter.active{outline:2px solid #333;background:#eee}.iconFilter .ico{font-size:17px;margin-right:3px}
.dot{width:13px;height:13px;border-radius:50%;display:inline-block;border:1px solid #222}
.hot{background:#d7191c} .review{background:#f28e2b} .lower{background:#f4d03f} .backup{background:#2f75b5} .pass{background:#777}
#map{flex:1;min-height:0}
.pin{border:2px solid #111;border-radius:50%;width:30px;height:30px;line-height:26px;text-align:center;font:bold 11px Arial;color:#111;box-shadow:0 2px 5px rgba(0,0,0,.45)}
.pin.hot{background:#d7191c;color:#fff} .pin.review{background:#f28e2b;color:#111} .pin.lower{background:#f4d03f;color:#111} .pin.backup{background:#2f75b5;color:#fff} .pin.pass{background:#777;color:#fff}
.leaflet-popup-content{min-width:330px;max-width:470px;font:13px/1.35 Arial;margin:13px 16px}
.leaflet-popup-content h3{margin:0 0 7px;font-size:16px}
.badge{display:inline-block;border:1px solid #555;border-radius:4px;padding:2px 5px;font-weight:bold;margin-left:5px}
.row{margin:4px 0}
.small{font-size:11px;color:#666}
.priorityBtns{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.priorityBtns button{border:1px solid #444;border-radius:4px;padding:5px 7px;cursor:pointer;font-weight:bold}
.priorityBtns button[data-p="hot"]{background:#d7191c;color:#fff}
.priorityBtns button[data-p="review"]{background:#f28e2b}
.priorityBtns button[data-p="lower"]{background:#f4d03f}
.priorityBtns button[data-p="backup"]{background:#2f75b5;color:#fff}
.priorityBtns button[data-p="pass"]{background:#777;color:#fff}
.priorityBtns button.active{outline:3px solid #111}
.notes{width:100%;min-height:68px;box-sizing:border-box;border:1px solid #999;border-radius:4px;padding:6px;font:12px Arial}
.noteActions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:5px}
.saveNote{padding:5px 8px;border:1px solid #555;border-radius:4px;background:#fff;cursor:pointer}
.saved{font-size:11px;color:#2e6b2e}
.popupLinks{margin-top:7px;display:flex;gap:10px;flex-wrap:wrap}
#message{font-size:12px;color:#2e6b2e;font-weight:bold}
@media(max-width:700px){.controls input[type=text]{min-width:180px;flex:1} .titleRow h2{font-size:16px} .leaflet-popup-content{min-width:265px;max-width:315px}}
</style>
</head>
<body>
<div id="app">
<div id="toolbar">
  <div class="titleRow">
    <h2>Tennessee Family Compound — Master Review Map</h2>
    <span class="stats" id="stats"></span>
    <span id="message"></span>
  </div>
  <div class="controls">
    <input id="search" type="text" placeholder="Search address, city, county, APN, notes or rank…">
    <select id="batch"><option value="all">All ranks</option></select>
    <span class="small"><strong>Custom ranks:</strong></span>
    <input id="rankFrom" type="number" min="1" placeholder="From" style="width:72px;min-width:72px">
    <input id="rankTo" type="number" min="1" placeholder="To" style="width:72px;min-width:72px">
    <button id="applyRank">Show range</button>
    <button id="clearRank">Clear range</button>
    <select id="county"><option value="all">All counties</option></select>
    <button id="fit">Fit visible pins</button>
    <button id="exportCsv">Export review CSV</button>
    <button id="exportJson">Backup notes/status</button>
    <label class="fileBtn">Restore backup<input id="importJson" type="file" accept=".json" style="display:none"></label>
  </div>
  <div class="legend">
    <strong>Show:</strong>
    <label><input class="pf" type="checkbox" value="hot" checked><span class="dot hot"></span>Red = Hot</label>
    <label><input class="pf" type="checkbox" value="review" checked><span class="dot review"></span>Orange = Review</label>
    <label><input class="pf" type="checkbox" value="lower" checked><span class="dot lower"></span>Yellow = Lower priority</label>
    <label><input class="pf" type="checkbox" value="backup" checked><span class="dot backup"></span>Blue = Backup</label>
    <label><input class="pf" type="checkbox" value="pass"><span class="dot pass"></span>Gray = Pass/Remove</label>
    <span class="small">Any non-gray color = KEEP. Changes and notes save in this browser.</span>
  </div>
  <div class="iconFilters" id="iconFilters">
    <strong>Quick filters:</strong>
    <button class="iconFilter" data-feature="horse" title="Horse ready / strong horse potential"><span class="ico">🐴</span>Horse ready</button>
    <button class="iconFilter" data-feature="residence" title="Existing residence on property"><span class="ico">🏠</span>Residence</button>
    <button class="iconFilter" data-feature="domesticwater" title="Confirmed domestic water: well, public/city/utility water, tap or meter"><span class="ico">💧</span>Water / well</button>
    <button class="iconFilter" data-feature="electric" title="Confirmed electricity or power on/available to property"><span class="ico">⚡</span>Electric</button>
    <button class="iconFilter" data-feature="septic" title="Confirmed septic, sewer, perc/perk approval or septic site"><span class="ico">🚽</span>Septic / sewer</button>
    <button class="iconFilter" data-feature="water" title="Pond, creek, spring, lake or other water on property"><span class="ico">🌊</span>Water on property</button>
    <button class="iconFilter" data-feature="driveby" title="Recommended for drive-by or visit"><span class="ico">🚗</span>Drive-by</button>
    <button class="iconFilter" data-feature="motivated" title="Seller motivation / price cuts / distressed or relisted"><span class="ico">💲</span>Motivated seller</button>
    <button class="iconFilter" data-feature="warning" title="Restrictions, access, flood, terrain or other warning"><span class="ico">⚠️</span>Warnings</button>
    <button class="iconFilter" data-feature="compound" title="Strong family-compound potential"><span class="ico">👨‍👩‍👧‍👦</span>Compound fit</button>
    <button class="iconFilter" id="clearIcons" title="Clear all icon filters">Clear icons</button>
    <span class="small">Select one or more. Multiple selected icons must all match.</span>
  </div>
</div>
<div id="map"></div>
</div>

const STORE="tnFamilyCompoundReview_v2";
let review={};
try{review=JSON.parse(localStorage.getItem(STORE)||"{}")||{}}catch(e){review={}}
const COLORS={hot:"#d7191c",review:"#f28e2b",lower:"#f4d03f",backup:"#2f75b5",pass:"#777"};
const LABELS={hot:"HOT",review:"REVIEW",lower:"LOWER PRIORITY",backup:"BACKUP",pass:"PASS / REMOVE"};
const map=L.map("map").setView([35.8,-86.3],7);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);
const markers=new Map();

function esc(v){
  if(v===null||v===undefined||v==="") return "";
  return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function money(v){return (typeof v==="number") ? "$"+Math.round(v).toLocaleString() : esc(v||"Verify");}
function val(v){return (v===null||v===undefined||v==="") ? "Verify" : esc(v);}
function current(p){return Object.assign({priority:p.priority,notes:""},review[p.id]||{});}
function saveReview(patchId, patch){
  review[patchId]=Object.assign({},review[patchId]||{},patch);
  localStorage.setItem(STORE,JSON.stringify(review));
}
function iconFor(p){
  const s=current(p).priority||p.priority;
  return L.divIcon({className:"",html:`<div class="pin ${s}">${p.rank}</div>`,iconSize:[30,30],iconAnchor:[15,15]});
}
function mapsUrl(p){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.address+", "+p.city+", TN "+(p.zip||""));}
function popup(p){
 const r=current(p), pr=r.priority||p.priority;
 const exact=p.precision==="exact listing"||p.precision==="address";
 const coordinateNote= exact ? "Pin location is based on an address/listing coordinate." : "Approximate locality pin for screening — verify the exact parcel in county GIS before visiting.";
 const listing=p.link ? `<a target="_blank" rel="noopener" href="${esc(p.link)}">Open source/listing</a>` : "";
 const fields=[
  ["Status / motivation",p.status],["Residence(s)",p.residences],["Beds/Baths",p.beds],["Sq Ft",p.sqft],["Built",p.built],
  ["Barn / outbuildings",p.barn],["Water",p.water],["Septic / sewer",p.septic],["Restrictions / HOA",p.restrictions],
  ["Horse potential",p.horse],["Compound fit",p.fit],["Parcel / APN",p.parcel],["Listing history",p.history],
  ["Key positives",p.positives],["Concerns / due diligence",p.concerns],["Recommendation",p.recommendation]
 ].filter(x=>x[1]!==null&&x[1]!==undefined&&x[1]!=="");
 let fhtml=fields.map(x=>`<div class="row"><b>${esc(x[0])}:</b> ${val(x[1])}</div>`).join("");
 return `<h3>#${p.rank} — ${esc(p.address)}</h3>
 <div><b>Score:</b> ${val(p.score)} <span class="badge">${LABELS[pr]}</span></div>
 <div class="row"><b>Quick flags:</b> ${[
   ["horse","🐴"],["residence","🏠"],["domesticwater","💧"],["electric","⚡"],["septic","🚽"],["water","🌊"],["driveby","🚗"],["motivated","💲"],["warning","⚠️"],["compound","👨‍👩‍👧‍👦"]
 ].filter(x=>hasFeature(p,x[0])).map(x=>x[1]).join(" ") || "—"}</div>
 <div class="row"><b>${esc(p.city)}, ${esc(p.county)} County</b> &nbsp; <b>Acres:</b> ${val(p.acres)} &nbsp; <b>Price:</b> ${money(p.price)}</div>
 ${fhtml}
 <div class="priorityBtns" data-id="${p.id}">
   ${["hot","review","lower","backup","pass"].map(s=>`<button data-p="${s}" class="${pr===s?"active":""}" onclick="setPriority('${p.id}','${s}')">${LABELS[s]}</button>`).join("")}
 </div>
 <b>Your notes:</b>
 <textarea class="notes" id="notes-${p.id}" placeholder="Add call notes, septic questions, family comments, drive-by notes, etc.">${esc(r.notes||"")}</textarea>
 <div class="noteActions"><button class="saveNote" onclick="saveNotes('${p.id}')">Save notes</button><span class="saved" id="saved-${p.id}"></span></div>
 <div class="popupLinks"><a target="_blank" rel="noopener" href="${mapsUrl(p)}">Open in Google Maps</a>${listing}</div>
 <div class="small" style="margin-top:7px">${coordinateNote}</div>`;
}
for(const p of PROPS){
 const m=L.marker([p.lat,p.lon],{icon:iconFor(p)}).bindPopup(()=>popup(p),{maxHeight:520});
 markers.set(p.id,m);
}

function setPriority(id,priority){
 const p=PROPS.find(x=>x.id===id); if(!p)return;
 saveReview(id,{priority});
 const m=markers.get(id); m.setIcon(iconFor(p)); m.setPopupContent(popup(p));
 applyFilters(false);
 flash("Saved "+LABELS[priority]);
}
window.setPriority=setPriority;
function saveNotes(id){
 const el=document.getElementById("notes-"+id); if(!el)return;
 saveReview(id,{notes:el.value});
 const s=document.getElementById("saved-"+id); if(s){s.textContent="Saved";setTimeout(()=>s.textContent="",1500)}
 updateStats();
}
window.saveNotes=saveNotes;

const batch=document.getElementById("batch");
for(let start=1;start<=PROPS.length;start+=20){
 const end=Math.min(start+19,PROPS.length), o=document.createElement("option");
 o.value=start+"-"+end;o.textContent="Ranks "+start+"–"+end;batch.appendChild(o);
}
const county=document.getElementById("county");
[...new Set(PROPS.map(p=>p.county).filter(Boolean))].sort().forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c+" County";county.appendChild(o)});

function selectedPriorities(){return new Set([...document.querySelectorAll(".pf:checked")].map(x=>x.value));}
function searchText(p){
 const r=current(p);
 return [p.rank,p.score,p.address,p.city,p.county,p.zip,p.parcel,p.status,p.residences,p.fit,p.positives,p.concerns,r.notes].join(" ").toLowerCase();
}
function blob(p){
 return [p.address,p.city,p.county,p.status,p.residences,p.barn,p.water,p.septic,p.restrictions,p.horse,p.fit,p.history,p.positives,p.concerns,p.recommendation,p.source].join(" ").toLowerCase();
}
function hasFeature(p,f){
 const s=blob(p);
 if(f==="horse") return /(horse|equestrian|pasture|fenc|cattle|livestock|arena|stall|run-in)/.test(s);
 if(f==="residence") return !/(vacant|no house|land only|no residence)/.test((p.residences||"").toLowerCase()) && /(?:house|home|cabin|farmhouse|residence|guest|suite|mobile|manufactured|unfinished|br\/|bedroom|main)/.test(((p.residences||"")+" "+(p.fit||"")).toLowerCase());
 if(f==="domesticwater"){
   const w=(p.water||"").toLowerCase();
   return /(well|public water|city water|utility water|water meter|water tap|water district|municipal water)/.test(w) && !/(verify|unknown|tbd|needed|need well)/.test(w);
 }
 if(f==="electric"){
   const e=[p.status,p.positives,p.water,p.septic,p.history,p.recommendation,p.source].join(" ").toLowerCase();
   return /(electric(ity)? (on|at|available|installed|present)|power (on|at|available|installed|present)|200a|200 amp|electric meter|power meter)/.test(e);
 }
 if(f==="septic"){
   const se=(p.septic||"").toLowerCase();
   return /(septic|sewer|perk|perc)/.test(se) && !/(verify|unknown|tbd|needed|need septic|no septic|no sewer)/.test(se);
 }
 if(f==="water") return /(pond|creek|spring|lake|stream|river|waterfall|branch|water frontage|year-round water|year round creek)/.test(s);
 if(f==="driveby") return /(drive-by|drive by|ready to visit|top candidate|priority research|priority|★★|9\.[2-9])/.test(s) || Number(p.score)>=9.2;
 if(f==="motivated") return /(price cut|price reduction|reduced|drop|motivated|hud|foreclos|as-is|relist|withdrawn|expired|back at|under contract.*back|massive price|long dom|days on market)/.test(s);
 if(f==="warning") return /(landlocked|easement|flood|restriction|hoa|cannot be subdivided|can't be subdivided|no manufactured|site-built|site built|steep|access|verify|concern|survey required|private road|wetland|covenant)/.test(((p.restrictions||"")+" "+(p.concerns||"")+" "+(p.status||"")).toLowerCase());
 if(f==="compound") return /(compound|2 houses|two houses|guest|multiple homesite|multiple home|two septic|2 septic|separate well|family)/.test(s) || Number(p.score)>=9.2;
 return true;
}
function selectedFeatures(){return [...document.querySelectorAll(".iconFilter.active[data-feature]")].map(b=>b.dataset.feature);}
function visible(p){
 const prs=selectedPriorities(); if(!prs.has(current(p).priority||p.priority))return false;
 const feats=selectedFeatures(); if(feats.length && !feats.every(f=>hasFeature(p,f)))return false;
 if(county.value!=="all"&&p.county!==county.value)return false;
 const rf=parseInt(document.getElementById("rankFrom").value,10);
 const rt=parseInt(document.getElementById("rankTo").value,10);
 if(!Number.isNaN(rf)&&p.rank<rf)return false;
 if(!Number.isNaN(rt)&&p.rank>rt)return false;
 if(Number.isNaN(rf)&&Number.isNaN(rt)&&batch.value!=="all"){const [a,b]=batch.value.split("-").map(Number);if(p.rank<a||p.rank>b)return false;}
 const q=document.getElementById("search").value.trim().toLowerCase(); if(q&&!searchText(p).includes(q))return false;
 return true;
}
function applyFilters(fit=true){
 let pts=[];
 for(const p of PROPS){
  const m=markers.get(p.id), show=visible(p);
  if(show){if(!map.hasLayer(m))m.addTo(map);pts.push([p.lat,p.lon]);}
  else if(map.hasLayer(m))map.removeLayer(m);
 }
 updateStats();
 if(fit&&pts.length)map.fitBounds(pts,{padding:[30,30],maxZoom:10});
}
function updateStats(){
 const c={hot:0,review:0,lower:0,backup:0,pass:0}, visibleCount=PROPS.filter(visible).length;
 PROPS.forEach(p=>c[current(p).priority||p.priority]++);
 document.getElementById("stats").textContent=`${PROPS.length} properties | 🔴 ${c.hot} hot | 🟠 ${c.review} review | 🟡 ${c.lower} lower | 🔵 ${c.backup} backup | ⚫ ${c.pass} pass | ${visibleCount} showing`;
}
function flash(t){const e=document.getElementById("message");e.textContent=t;setTimeout(()=>e.textContent="",1800)}
document.querySelectorAll(".pf").forEach(x=>x.addEventListener("change",()=>applyFilters(false)));
document.querySelectorAll(".iconFilter[data-feature]").forEach(b=>b.addEventListener("click",()=>{b.classList.toggle("active");applyFilters(true);}));
document.getElementById("clearIcons").addEventListener("click",()=>{document.querySelectorAll(".iconFilter[data-feature]").forEach(b=>b.classList.remove("active"));applyFilters(true);});
county.addEventListener("change",()=>applyFilters(true));
batch.addEventListener("change",()=>applyFilters(true));
document.getElementById("search").addEventListener("input",()=>applyFilters(false));
document.getElementById("applyRank").addEventListener("click",()=>{batch.value="all";applyFilters(true);});
document.getElementById("clearRank").addEventListener("click",()=>{document.getElementById("rankFrom").value="";document.getElementById("rankTo").value="";applyFilters(true);});
document.getElementById("rankFrom").addEventListener("keydown",e=>{if(e.key==="Enter"){batch.value="all";applyFilters(true);}});
document.getElementById("rankTo").addEventListener("keydown",e=>{if(e.key==="Enter"){batch.value="all";applyFilters(true);}});
batch.addEventListener("change",()=>{document.getElementById("rankFrom").value="";document.getElementById("rankTo").value="";});
document.getElementById("fit").addEventListener("click",()=>applyFilters(true));

function dl(name,text,type){
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
function csvCell(v){v=(v??"").toString().replace(/"/g,'""');return '"'+v+'"';}
document.getElementById("exportCsv").onclick=()=>{
 const hdr=["Rank","Score","Priority","Address","City","County","ZIP","Acres","Price","Status","Parcel/APN","Recommendation","Your Notes"];
 const lines=[hdr.map(csvCell).join(",")];
 for(const p of PROPS){const r=current(p);lines.push([p.rank,p.score,LABELS[r.priority||p.priority],p.address,p.city,p.county,p.zip,p.acres,p.price,p.status,p.parcel,p.recommendation,r.notes||""].map(csvCell).join(","));}
 dl("TN_family_compound_review.csv",lines.join("\n"),"text/csv");
};
document.getElementById("exportJson").onclick=()=>dl("TN_family_compound_review_backup.json",JSON.stringify({exported:new Date().toISOString(),review},null,2),"application/json");
document.getElementById("importJson").onchange=(ev)=>{
 const f=ev.target.files[0]; if(!f)return; const rd=new FileReader();
 rd.onload=()=>{try{const obj=JSON.parse(rd.result);review=obj.review||obj||{};localStorage.setItem(STORE,JSON.stringify(review));for(const p of PROPS)markers.get(p.id).setIcon(iconFor(p));applyFilters(false);flash("Backup restored");}catch(e){alert("That backup file could not be read.")}};
 rd.readAsText(f);
};
applyFilters(true);
</script>
</body>
</html>
